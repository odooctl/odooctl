version: 2
updates:
  # `uv` (not `pip`) so refreshes land in uv.lock — the file CI now installs
  # from. A pip-ecosystem entry would only touch pyproject.toml bounds and
  # leave the lock, and therefore CI, unchanged.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
