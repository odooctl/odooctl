name: Release

on:
  push:
    tags:
      - 'v*'

env:
  # Keep in sync with .github/workflows/ci.yml so releases are built by the
  # same resolver that validated the commit.
  UV_VERSION: '0.12.3'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release_type.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The documentation gate builds every retained release tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
      - name: Verify tag matches package version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Install locked environment
        run: uv sync --frozen --extra dev --extra api
      - name: Classify release channel with PEP 440
        id: release_type
        run: |
          prerelease="$(uv run --frozen python -c 'from packaging.version import Version; import os; print(str(Version(os.environ["GITHUB_REF_NAME"][1:]).is_prerelease).lower())')"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: uv run --frozen pytest -q
      - name: Build
        run: uv run --frozen python -m build
      - name: Build release documentation from this exact tag
        run: |
          uv run --frozen --with mkdocs-material python scripts/build_versioned_docs.py \
            --repo-root . \
            --site-dir site \
            --versions-file docs/versions.yml \
            --assets-dir docs/_versioning
          test -f "site/docs/${GITHUB_REF_NAME#v}/index.html"
      # Deliberately unlocked: verifies the artifact we are about to publish
      # installs cleanly from live PyPI, exactly as a user would get it.
      - name: Smoke-install wheel
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/odooctl --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
      contents: write  # GitHub release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease }}
          make_latest: ${{ needs.build.outputs.prerelease == 'true' && 'false' || 'true' }}

  publish-docs:
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: odooctl-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Publish immutable releases from tags and development docs from master.
          fetch-depth: 0
          ref: master
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
      - name: Install locked project environment
        run: uv sync --frozen
      - name: Publish retained documentation including this release
        run: |
          uv run --frozen --with mkdocs-material python scripts/build_versioned_docs.py \
            --repo-root . \
            --site-dir site \
            --versions-file docs/versions.yml \
            --assets-dir docs/_versioning
          cp landing/index.html site/index.html
      - name: Deploy to odooctl/odooctl.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: odooctl/odooctl.github.io
          publish_branch: main
          publish_dir: site
